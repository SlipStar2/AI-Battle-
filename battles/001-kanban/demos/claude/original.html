<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Канбан-доска</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9ece7;--ink:#1c2420;--muted:#5f6a64;--card:#fbfcfa;--line:#cfd6ce;--col:#dde3db;--todo:#c27d22;--doing:#2c6bb0;--done:#37875f;--danger:#b3402f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a18;--ink:#e7ece8;--muted:#95a29b;--card:#222a27;--line:#35413c;--col:#1d2421;--todo:#e09a3f;--doing:#5b9ae0;--done:#5cb487;--danger:#e0705e}}
:root[data-theme="dark"]{--bg:#151a18;--ink:#e7ece8;--muted:#95a29b;--card:#222a27;--line:#35413c;--col:#1d2421;--todo:#e09a3f;--doing:#5b9ae0;--done:#5cb487;--danger:#e0705e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:22px 24px 6px;max-width:1200px;margin:0 auto}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.total{color:var(--muted);font-size:14px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:12px 24px 40px;max-width:1200px;margin:0 auto;align-items:start}
.col{background:var(--col);border-radius:14px;border-top:4px solid var(--c);padding:12px;transition:box-shadow .2s}
.col.over{box-shadow:inset 0 0 0 2px var(--c)}
.col>header{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
h2{font-size:15px;font-weight:650;margin:0;flex:1}
.count{min-width:28px;text-align:center;padding:1px 9px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px;min-height:72px}
.list:empty::before{content:"Пока пусто. Перетащите сюда карточку.";color:var(--muted);font-size:13px;text-align:center;padding:22px 8px;border:1.5px dashed var(--line);border-radius:10px}
.ph{border:1.5px dashed var(--c);border-radius:10px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.card{display:flex;gap:4px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px 10px 2px;cursor:grab;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.07);transition:transform .18s,box-shadow .18s}
.card.dragging{cursor:grabbing;transform:rotate(2.5deg) scale(1.03);box-shadow:0 16px 30px rgba(0,0,0,.25)}
.grip{flex:none;width:24px;align-self:stretch;display:grid;place-items:center;color:var(--muted);touch-action:none;font-size:15px}
.body{flex:1;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.card p{margin:4px 0 0;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.acts{display:flex;flex-direction:column;gap:2px}
.ib{width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:15px;cursor:pointer}
.ib:hover{background:var(--col);color:var(--ink)}
.ib.del:hover{color:var(--danger)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--doing);outline-offset:2px}
.addbtn{margin-top:10px;width:100%;padding:9px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;font:inherit;font-weight:500;cursor:pointer}
.addbtn:hover{background:var(--card);color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:20px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-size:18px;flex:none}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:96px;resize:vertical}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--card);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;transition:opacity .2s,transform .2s;z-index:100}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
@media (max-width:820px){.board{grid-template-columns:1fr;padding:12px 16px 40px}.top{padding:18px 16px 4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><h1>Канбан-доска</h1><span class="total" id="total"></span></div>
<main class="board" id="board"></main>

<dialog id="dlg">
  <form id="f">
    <h2 id="dt">Новая карточка</h2>
    <label for="ft">Заголовок</label>
    <input id="ft" required maxlength="80" autocomplete="off">
    <label for="fd">Описание</label>
    <textarea id="fd" maxlength="500"></textarea>
    <label for="fc">Колонка</label>
    <select id="fc"></select>
    <div class="btns">
      <button type="button" class="btn" id="cancel">Отмена</button>
      <button type="submit" class="btn primary">Сохранить</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"><span id="tmsg"></span><button id="undo" type="button">Отменить</button></div>

<script>
const COLS=[{id:'todo',name:'К выполнению'},{id:'doing',name:'В работе'},{id:'done',name:'Готово'}];
const KEY='kanban-board-v1';
const $=(s,r=document)=>r.querySelector(s);
const DUR=matchMedia('(prefers-reduced-motion: reduce)').matches?0:220;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    if(Array.isArray(d))return d.filter(c=>c&&c.id&&c.title&&COLS.some(x=>x.id===c.col));
  }catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cards))}catch(e){}}

let cards=load()||[
  {id:uid(),col:'todo',title:'Составить список задач',desc:'Нажмите ✎, чтобы изменить эту карточку.'},
  {id:uid(),col:'todo',title:'Перетащите меня',desc:'Возьмите карточку и перенесите в другую колонку. На телефоне тяните за значок слева.'},
  {id:uid(),col:'doing',title:'Попробовать доску',desc:'Создайте свою карточку кнопкой «Добавить карточку».'},
  {id:uid(),col:'done',title:'Открыть доску',desc:''}
];

const board=$('#board'),dlg=$('#dlg');
board.innerHTML=COLS.map(c=>`<section class="col" data-col="${c.id}" style="--c:var(--${c.id})"><header><h2>${c.name}</h2><span class="count" title="Карточек в колонке">0</span></header><div class="list"></div><button type="button" class="addbtn">+ Добавить карточку</button></section>`).join('');
$('#fc').innerHTML=COLS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');

function rects(){
  const m=new Map();
  document.querySelectorAll('.card:not(.dragging)').forEach(e=>m.set(e.dataset.id,e.getBoundingClientRect()));
  return m;
}
function flip(first){
  document.querySelectorAll('.card:not(.dragging)').forEach(e=>{
    const a=first.get(e.dataset.id);if(!a)return;
    const b=e.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
    if(!dx&&!dy)return;
    e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:DUR,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}
function cardEl(c){
  const el=document.createElement('article');
  el.className='card';el.dataset.id=c.id;
  const grip=document.createElement('div');grip.className='grip';grip.textContent='⋮⋮';grip.title='Перетащить';
  const body=document.createElement('div');body.className='body';
  const h=document.createElement('h3');h.textContent=c.title;body.append(h);
  if(c.desc){const p=document.createElement('p');p.textContent=c.desc;body.append(p)}
  const acts=document.createElement('div');acts.className='acts';
  acts.innerHTML='<button type="button" class="ib" data-act="edit" aria-label="Редактировать" title="Редактировать">✎</button><button type="button" class="ib del" data-act="del" aria-label="Удалить" title="Удалить">✕</button>';
  el.append(grip,body,acts);
  return el;
}
let pop=null;
function render(){
  const first=rects();
  COLS.forEach(c=>{
    const col=$(`.col[data-col="${c.id}"]`),items=cards.filter(x=>x.col===c.id);
    $('.list',col).replaceChildren(...items.map(cardEl));
    $('.count',col).textContent=items.length;
  });
  $('#total').textContent='Всего карточек: '+cards.length;
  flip(first);
  if(pop){
    const el=$(`.card[data-id="${pop}"]`);
    if(el)el.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],{duration:DUR,easing:'ease-out'});
    pop=null;
  }
}

/* Создание и редактирование */
let editing=null;
function openDlg(id,col){
  editing=id;
  const c=id&&cards.find(x=>x.id===id);
  $('#dt').textContent=c?'Редактирование карточки':'Новая карточка';
  $('#ft').value=c?c.title:'';$('#fd').value=c?c.desc:'';$('#fc').value=c?c.col:col;
  dlg.showModal();$('#ft').focus();
}
$('#f').addEventListener('submit',e=>{
  e.preventDefault();
  const title=$('#ft').value.trim(),desc=$('#fd').value.trim(),col=$('#fc').value;
  if(!title){$('#ft').focus();return}
  if(editing){
    const c=cards.find(x=>x.id===editing);
    c.title=title;c.desc=desc;
    if(c.col!==col){c.col=col;cards=cards.filter(x=>x!==c);cards.push(c)}
  }else{
    const c={id:uid(),title,desc,col};cards.push(c);pop=c.id;
  }
  save();dlg.close();render();
});
$('#cancel').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* Удаление с отменой */
let last=null,tt=null;
function del(id){
  const el=$(`.card[data-id="${id}"]`),i=cards.findIndex(x=>x.id===id);
  if(i<0)return;
  const go=()=>{last={card:cards[i],i};cards.splice(i,1);save();render();toast('Карточка удалена')};
  if(el&&DUR)el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.9)'}],{duration:DUR,fill:'forwards'}).onfinish=go;else go();
}
function toast(msg){
  $('#tmsg').textContent=msg;$('#toast').classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('show'),5000);
}
$('#undo').onclick=()=>{
  if(!last)return;
  cards.splice(last.i,0,last.card);pop=last.card.id;last=null;
  save();render();$('#toast').classList.remove('show');
};

board.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('addbtn'))return openDlg(null,b.closest('.col').dataset.col);
  const card=b.closest('.card');if(!card)return;
  if(b.dataset.act==='edit')openDlg(card.dataset.id);
  if(b.dataset.act==='del')del(card.dataset.id);
});
board.addEventListener('dblclick',e=>{
  const c=e.target.closest('.card');
  if(c&&!e.target.closest('button'))openDlg(c.dataset.id);
});

/* Перетаскивание */
let drag=null;
board.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.card');
  if(!card||e.target.closest('button')||e.button!==0)return;
  if(e.pointerType!=='mouse'&&!e.target.closest('.grip'))return;
  drag={card,id:card.dataset.id,sx:e.clientX,sy:e.clientY,pid:e.pointerId,started:false};
});
addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;
    startDrag();
  }
  moveDrag(e);
});
addEventListener('pointerup',endDrag);
addEventListener('pointercancel',endDrag);

function startDrag(){
  const c=drag.card,r=c.getBoundingClientRect();
  drag.started=true;drag.ox=drag.sx-r.left;drag.oy=drag.sy-r.top;
  const ph=document.createElement('div');
  ph.className='ph';ph.style.height=r.height+'px';
  c.after(ph);drag.ph=ph;
  Object.assign(c.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',margin:'0',zIndex:50,pointerEvents:'none'});
  c.classList.add('dragging');
  getSelection().removeAllRanges();
}
function moveDrag(e){
  const c=drag.card,ph=drag.ph;
  c.style.left=(e.clientX-drag.ox)+'px';
  c.style.top=(e.clientY-drag.oy)+'px';
  if(e.clientY<70)scrollBy(0,-14);else if(innerHeight-e.clientY<70)scrollBy(0,14);
  const el=document.elementFromPoint(e.clientX,e.clientY),col=el&&el.closest('.col');
  document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));
  if(!col)return;
  col.classList.add('over');
  const list=$('.list',col);
  let before=null;
  for(const s of list.querySelectorAll('.card')){
    if(s===c)continue;
    const r=s.getBoundingClientRect();
    if(e.clientY<r.top+r.height/2){before=s;break}
  }
  const same=ph.parentNode===list&&(before?ph.nextElementSibling===before:!ph.nextElementSibling||ph.nextElementSibling===c);
  if(same)return;
  const first=rects();
  list.insertBefore(ph,before);
  flip(first);
}
function endDrag(e){
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;drag=null;
  if(!d.started)return;
  document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'));
  const c=d.card,ph=d.ph,r=ph.getBoundingClientRect();
  const list=ph.parentNode,col=list.closest('.col').dataset.col;
  c.style.transition='left '+DUR+'ms cubic-bezier(.2,.8,.2,1),top '+DUR+'ms cubic-bezier(.2,.8,.2,1),transform '+DUR+'ms,box-shadow '+DUR+'ms';
  c.style.left=r.left+'px';c.style.top=r.top+'px';
  c.classList.remove('dragging');
  setTimeout(()=>{
    const ids=[...list.children].filter(x=>x!==c).map(x=>x===ph?d.id:x.dataset.id);
    const byId=Object.fromEntries(cards.map(x=>[x.id,x]));
    byId[d.id].col=col;
    cards=[...cards.filter(x=>x.col!==col&&x.id!==d.id),...ids.map(i=>byId[i])];
    save();render();
  },DUR+20);
}

render();
</script>
</body>
</html>
